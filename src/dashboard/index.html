<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thống kê tín hiệu</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-1: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --hover: rgba(11, 11, 11, 0.04);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #6250d6;
    --series-8: #e34948;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --pos-text: #006300;
    --neg-text: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-1: #f0efec;
      --text-2: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --hover: rgba(255, 255, 255, 0.04);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
      --pos-text: #0ca30c;
      --neg-text: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-1: #f0efec;
    --text-2: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.04);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
    --pos-text: #0ca30c;
    --neg-text: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-1);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .sub, .note { color: var(--text-2); font-size: 13px; margin: 2px 0 0; }
  .pos { color: var(--pos-text); }
  .neg { color: var(--neg-text); }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }

  .error {
    margin-top: 16px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .error::before { content: "✕"; color: var(--critical); font-weight: 700; margin-right: 8px; }

  .filters { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin-top: 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); }
  select, input, .segmented button {
    font: inherit; font-size: 14px; color: var(--text-1);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; min-height: 34px;
  }
  input[type="number"] { width: 100px; font-variant-numeric: tabular-nums; }
  .segmented { display: inline-flex; }
  .segmented button { cursor: pointer; border-radius: 0; color: var(--text-2); }
  .segmented button:first-child { border-radius: 8px 0 0 8px; }
  .segmented button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
  .segmented button[aria-pressed="true"] { color: var(--text-1); font-weight: 600; background: var(--hover); }
  .sizes { display: flex; flex-wrap: wrap; gap: 12px 16px; margin-top: 12px; align-items: flex-end; }
  .sizes .hint { font-size: 12px; color: var(--muted); padding-bottom: 8px; }

  .content { transition: opacity 0.15s; }
  .loading .content { opacity: 0.55; }

  .summary {
    display: grid; gap: 12px; margin-top: 20px;
    grid-template-columns: minmax(260px, 1.5fr) repeat(3, minmax(150px, 1fr));
  }
  @media (max-width: 860px) { .summary { grid-template-columns: 1fr 1fr; } .summary .hero { grid-column: 1 / -1; } }
  @media (max-width: 420px) { .summary { grid-template-columns: 1fr; } }
  .tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .tile { padding: 14px 16px; min-width: 0; }
  .tile .label { font-size: 13px; color: var(--text-2); }
  .tile .value { font-size: 28px; font-weight: 600; line-height: 1.25; margin-top: 4px; overflow-wrap: anywhere; }
  .tile.hero .value { font-size: 48px; line-height: 1.1; }
  .tile .detail { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  .card { padding: 16px; margin-top: 16px; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-bottom: 12px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-2); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .line-key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; outline: none; }
  .chart svg:focus-visible { box-shadow: 0 0 0 2px var(--axis); border-radius: 4px; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .zero { stroke: var(--axis); stroke-width: 1; }
  .chart .axis-label { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .end-label { fill: var(--text-1); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { stroke: var(--surface); stroke-width: 2; }
  .chart .crosshair { stroke: var(--axis); stroke-width: 1; }
  .tip {
    position: absolute; top: 8px; pointer-events: none; z-index: 2;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12); padding: 8px 10px; font-size: 12px; min-width: 170px; max-width: 280px;
  }
  .tip .when { color: var(--text-2); margin-bottom: 4px; }
  .tip .row { display: flex; align-items: center; gap: 8px; }
  .tip .row strong { font-size: 13px; font-variant-numeric: tabular-nums; }
  .tip .row span { color: var(--text-2); }
  .tip .closed { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--grid); color: var(--text-2); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-weight: 500; color: var(--text-2); white-space: nowrap;
    padding: 8px 7px; border-bottom: 1px solid var(--axis);
  }
  td { padding: 8px 7px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  tbody tr:hover td { background: var(--hover); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .name-cell { font-weight: 500; }
  .tag { color: var(--muted); font-size: 12px; margin-left: 6px; }

  .bar-cell { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .track { position: relative; width: 96px; height: 12px; flex: none; }
  .track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
  .bar { position: absolute; top: 0; height: 12px; }
  .bar.up { left: calc(50% + 1px); background: var(--good); border-radius: 0 4px 4px 0; }
  .bar.down { right: 50%; background: var(--critical); border-radius: 4px 0 0 4px; }
  .bar-value { min-width: 84px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  .status { display: inline-flex; align-items: center; gap: 6px; }
  .status i {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    display: inline-grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; color: #fff;
  }
  .status.tp i { background: var(--good); }
  .status.sl i { background: var(--critical); }
  .status.expired i { background: var(--warning); color: #0b0b0b; }
  .status.open i { border: 2px solid var(--muted); }

  .empty { color: var(--text-2); padding: 24px 0; text-align: center; }
  .news-banner {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--hover); font-weight: 500;
  }
  tr.past td { color: var(--muted); }
  .footnote { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Thống kê tín hiệu</h1>
    <p class="sub" id="updated">Đang tải dữ liệu…</p>
  </header>

  <div class="error" id="error" hidden></div>

  <section class="card" id="news-card" hidden>
    <div class="card-head">
      <div>
        <h2>Lịch tin tức</h2>
        <p class="note" id="news-note"></p>
      </div>
    </div>
    <div class="news-banner" id="news-banner" hidden></div>
    <div class="table-wrap" id="news"></div>
  </section>

  <div class="filters" role="group" aria-label="Bộ lọc">
    <label class="field">Thời gian
      <select id="f-range">
        <option value="7">7 ngày qua</option>
        <option value="30">30 ngày qua</option>
        <option value="90">90 ngày qua</option>
        <option value="ALL">Tất cả</option>
      </select>
    </label>
    <label class="field">Tài sản
      <select id="f-symbol"></select>
    </label>
    <label class="field">Phương pháp
      <select id="f-strategy"></select>
    </label>
    <label class="field">Tín hiệu
      <select id="f-sent">
        <option value="SENT">Đã gửi Telegram</option>
        <option value="REJECTED">Bị AI từ chối</option>
        <option value="ALL">Tất cả</option>
      </select>
    </label>
    <div class="field">Đơn vị
      <div class="segmented" id="f-unit">
        <button type="button" data-unit="USD">USD</button>
        <button type="button" data-unit="R">R</button>
      </div>
    </div>
  </div>
  <div class="sizes" id="sizes" role="group" aria-label="Khối lượng mỗi lệnh"></div>

  <div class="content">
    <section class="summary" id="summary" aria-label="Tổng quan"></section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>Lãi/lỗ tích lũy</h2>
          <p class="note">Cộng dồn theo thời điểm đóng lệnh, tách theo tài sản</p>
        </div>
        <div class="legend" id="equity-legend"></div>
      </div>
      <div class="chart" id="equity"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>Theo phương pháp</h2>
          <p class="note">Tín hiệu hợp lưu được tính cho phương pháp chính (điểm cao nhất)</p>
        </div>
      </div>
      <div class="table-wrap" id="by-strategy"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>Theo tài sản</h2>
        </div>
      </div>
      <div class="table-wrap" id="by-asset"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>Danh sách tín hiệu</h2>
          <p class="note" id="signals-note"></p>
        </div>
      </div>
      <div class="table-wrap" id="signals"></div>
    </section>

    <p class="footnote" id="footnote"></p>
  </div>
</main>

<script>
(() => {
  const STORAGE_KEY = 'signal-dashboard-settings';
  const REFRESH_MS = 60 * 1000;
  const MAX_ROWS = 300;
  const token = new URLSearchParams(location.search).get('token');
  // API nằm cùng cấp với /dashboard, kể cả khi mở bằng /dashboard/ (dấu / cuối) hoặc sau tiền tố proxy
  const API_BASE = location.pathname.replace(/dashboard\/?$/, '');
  const withToken = (url) => API_BASE + url + (token ? `?token=${encodeURIComponent(token)}` : '');
  const API_URL = withToken('api/signals');
  const NEWS_URL = withToken('api/news');
  const IMPACT_LABELS = { High: 'Mạnh', Medium: 'Trung bình', Low: 'Thấp' };
  const STATUS = {
    TP: { cls: 'tp', icon: '✓', label: 'Chạm TP1' },
    SL: { cls: 'sl', icon: '✕', label: 'Chạm SL' },
    EXPIRED: { cls: 'expired', icon: '–', label: 'Hết hạn' },
    OPEN: { cls: 'open', icon: '', label: 'Đang mở' },
  };

  const state = {
    data: null,
    news: null,
    filters: { range: 'ALL', symbol: 'ALL', strategy: 'ALL', sent: 'SENT', unit: 'USD' },
    sizes: {},
  };

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    Object.assign(state.filters, saved.filters || {});
    Object.assign(state.sizes, saved.sizes || {});
  } catch (e) {}

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ filters: state.filters, sizes: state.sizes }));
    } catch (e) {}
  }

  // ---------- DOM helpers (mọi nhãn đi qua textContent) ----------
  const $ = (sel) => document.querySelector(sel);
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null) continue;
      if (k === 'class') node.className = v;
      else if (k === 'style') node.style.cssText = v;
      else node.setAttribute(k, v);
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      node.append(c instanceof Node ? c : String(c));
    }
    return node;
  }
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs = {}, text) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text != null) node.textContent = text;
    return node;
  }

  // ---------- Định dạng ----------
  const sign = (v) => (v > 0.0000001 ? '+' : v < -0.0000001 ? '−' : '');
  const abs2 = (v, d = 2) => Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const signClass = (v) => (v > 0.0000001 ? 'pos' : v < -0.0000001 ? 'neg' : '');
  function fmtValue(v) {
    return state.filters.unit === 'R' ? `${sign(v)}${abs2(v)}R` : `${sign(v)}$${abs2(v)}`;
  }
  function fmtAxis(v, step) {
    const d = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
    return state.filters.unit === 'R' ? `${sign(v)}${abs2(v, d)}R` : `${sign(v)}$${abs2(v, d)}`;
  }
  const fmtPrice = (v) => (v == null ? '—' : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  const timeFmt = new Intl.DateTimeFormat('vi-VN', {
    timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
  });
  const dayFmt = new Intl.DateTimeFormat('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit' });
  const fmtTime = (t) => timeFmt.format(new Date(t));

  // ---------- Dữ liệu ----------
  const assets = () => state.data.assets;
  const assetOf = (symbol) => assets().find((a) => a.symbol === symbol) || { symbol, displayName: symbol, contractSize: 1, sizeUnit: 'coin' };
  // Màu theo thứ tự cố định của tài sản (không đổi khi lọc)
  const assetColor = (symbol) => `var(--series-${(assets().findIndex((a) => a.symbol === symbol) % 8) + 1})`;
  const shortName = (symbol) => assetOf(symbol).displayName.split(' (')[0];
  const defaultSize = (asset) => (asset.sizeUnit === 'lot' ? 0.01 : 1);
  function sizeFor(symbol) {
    const v = state.sizes[symbol];
    return Number.isFinite(v) && v >= 0 ? v : defaultSize(assetOf(symbol));
  }
  function value(rec) {
    return state.filters.unit === 'R' ? rec.r : rec.pnlPerUnit * rec.contractSize * sizeFor(rec.symbol);
  }
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);

  function filtered() {
    const f = state.filters;
    const since = f.range === 'ALL' ? -Infinity : Date.now() - Number(f.range) * 86400000;
    return state.data.records.filter((r) =>
      Date.parse(r.candleTime) >= since &&
      (f.symbol === 'ALL' || r.symbol === f.symbol) &&
      (f.strategy === 'ALL' || r.strategy === f.strategy) &&
      (f.sent === 'ALL' || (f.sent === 'SENT' ? r.sent : !r.sent)));
  }

  function summarize(list) {
    const closed = list.filter((r) => r.status !== 'OPEN');
    const open = list.filter((r) => r.status === 'OPEN');
    const wins = closed.filter((r) => r.status === 'TP').length;
    const losses = closed.filter((r) => r.status === 'SL').length;
    return {
      count: list.length,
      closed: closed.length,
      wins,
      losses,
      expired: closed.length - wins - losses,
      open: open.length,
      winRate: wins + losses > 0 ? wins / (wins + losses) : null,
      total: sum(closed.map(value)),
      avgR: closed.length > 0 ? sum(closed.map((r) => r.r)) / closed.length : null,
      floating: sum(open.map(value)),
    };
  }

  // ---------- Bộ lọc ----------
  function syncOptions(select, options, current) {
    const key = options.map((o) => o.value).join('|');
    if (select.dataset.key !== key) {
      select.replaceChildren(...options.map((o) => el('option', { value: o.value }, o.label)));
      select.dataset.key = key;
    }
    select.value = options.some((o) => o.value === current) ? current : 'ALL';
    return select.value;
  }

  function renderControls() {
    const f = state.filters;
    $('#f-range').value = f.range;
    $('#f-sent').value = f.sent;
    f.symbol = syncOptions($('#f-symbol'), [
      { value: 'ALL', label: 'Tất cả' },
      ...assets().map((a) => ({ value: a.symbol, label: a.displayName })),
    ], f.symbol);
    const strategies = [...new Set([...(state.data.strategies || []), ...state.data.records.map((r) => r.strategy)])];
    f.strategy = syncOptions($('#f-strategy'), [
      { value: 'ALL', label: 'Tất cả' },
      ...strategies.map((s) => ({ value: s, label: s })),
    ], f.strategy);
    for (const btn of document.querySelectorAll('#f-unit button')) {
      btn.setAttribute('aria-pressed', String(btn.dataset.unit === f.unit));
    }

    const sizes = $('#sizes');
    const key = assets().map((a) => a.symbol).join('|');
    if (sizes.dataset.key !== key) {
      sizes.dataset.key = key;
      sizes.replaceChildren(
        ...assets().map((a) => {
          const input = el('input', {
            type: 'number', min: '0', step: a.sizeUnit === 'lot' ? '0.01' : '0.001',
            value: String(sizeFor(a.symbol)), 'data-symbol': a.symbol,
          });
          input.addEventListener('input', () => {
            const v = parseFloat(input.value);
            if (Number.isFinite(v) && v >= 0) {
              state.sizes[a.symbol] = v;
              persist();
              renderContent();
            }
          });
          const unit = a.sizeUnit === 'lot' ? 'lot' : 'coin';
          return el('label', { class: 'field' }, `${a.displayName} (${unit})`, input);
        }),
        el('span', { class: 'hint' }, 'Khối lượng mỗi lệnh để quy ra USD · Vàng: 1 lot = 100 oz'),
      );
    }
    sizes.hidden = f.unit !== 'USD';
  }

  function bindControls() {
    for (const [id, key] of [['#f-range', 'range'], ['#f-symbol', 'symbol'], ['#f-strategy', 'strategy'], ['#f-sent', 'sent']]) {
      $(id).addEventListener('change', (e) => {
        state.filters[key] = e.target.value;
        persist();
        render();
      });
    }
    for (const btn of document.querySelectorAll('#f-unit button')) {
      btn.addEventListener('click', () => {
        state.filters.unit = btn.dataset.unit;
        persist();
        render();
      });
    }
  }

  // ---------- Tổng quan ----------
  function tile(label, valueText, valueClass, detail, hero) {
    return el('div', { class: `tile${hero ? ' hero' : ''}` },
      el('div', { class: 'label' }, label),
      el('div', { class: `value ${valueClass || ''}` }, valueText),
      detail ? el('div', { class: 'detail' }, detail) : null);
  }

  function renderSummary(list) {
    const s = summarize(list);
    $('#summary').replaceChildren(
      tile('Lãi/lỗ đã chốt', fmtValue(s.total), signClass(s.total),
        `${s.closed} lệnh đã đóng${s.avgR != null ? ` · TB ${sign(s.avgR)}${abs2(s.avgR)}R/lệnh` : ''}`, true),
      tile('Tỉ lệ thắng', s.winRate != null ? `${Math.round(s.winRate * 100)}%` : '—', '',
        `${s.wins} chạm TP1 · ${s.losses} chạm SL`),
      tile('Số tín hiệu', String(s.count), '', `${s.expired} hết hạn · ${s.open} đang mở`),
      tile('Đang mở (tạm tính)', s.open > 0 ? fmtValue(s.floating) : '—', s.open > 0 ? signClass(s.floating) : '',
        `${s.open} lệnh chưa chạm TP1/SL`),
    );
  }

  // ---------- Biểu đồ lãi/lỗ tích lũy ----------
  function niceTicks(min, max, count) {
    if (max - min < 1e-9) { min -= 1; max += 1; }
    const raw = (max - min) / count;
    const mag = 10 ** Math.floor(Math.log10(raw));
    const r = raw / mag;
    const step = (r >= 7.5 ? 10 : r >= 3.5 ? 5 : r >= 1.5 ? 2 : 1) * mag;
    const ticks = [];
    for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) {
      ticks.push(Math.round(v / step) * step);
    }
    return { ticks, step };
  }

  function valueAt(points, t) {
    let v = 0;
    for (const p of points) {
      if (p.t > t) break;
      v = p.v;
    }
    return v;
  }

  function renderEquity(list) {
    const host = $('#equity');
    const legend = $('#equity-legend');
    host.replaceChildren();
    legend.replaceChildren();

    const closed = list
      .filter((r) => r.status !== 'OPEN' && r.closedTime)
      .sort((a, b) => Date.parse(a.closedTime) - Date.parse(b.closedTime));
    if (closed.length === 0) {
      host.append(el('div', { class: 'empty' }, 'Chưa có lệnh nào đóng trong bộ lọc này.'));
      return;
    }

    const start = Math.min(...closed.map((r) => Date.parse(r.candleTime)));
    const end = Date.parse(closed[closed.length - 1].closedTime);
    const series = assets()
      .filter((a) => closed.some((r) => r.symbol === a.symbol))
      .map((a) => {
        let cum = 0;
        const points = [{ t: start, v: 0 }];
        for (const r of closed) {
          if (r.symbol !== a.symbol) continue;
          cum += value(r);
          points.push({ t: Date.parse(r.closedTime), v: cum });
        }
        return { asset: a, color: assetColor(a.symbol), points, last: cum };
      });
    const times = [...new Set([start, ...closed.map((r) => Date.parse(r.closedTime))])].sort((a, b) => a - b);

    if (series.length >= 2) {
      legend.append(...series.map((s) => el('span', {},
        el('i', { class: 'line-key', style: `background:${s.color}` }), s.asset.displayName)));
    }

    const width = Math.max(300, host.clientWidth);
    const height = 260;
    const m = { top: 14, right: 16, bottom: 28, left: 64 };
    const { ticks, step } = niceTicks(
      Math.min(0, ...series.flatMap((s) => s.points.map((p) => p.v))),
      Math.max(0, ...series.flatMap((s) => s.points.map((p) => p.v))),
      5,
    );
    const yMin = ticks[0];
    const yMax = ticks[ticks.length - 1];

    // Nhãn giá trị cuối đường: chỉ dùng khi không chồng lên nhau, nếu không thì để legend + tooltip
    const labelWidth = Math.max(...series.map((s) => fmtValue(s.last).length)) * 7.5 + 14;
    const plotBottom = height - m.bottom;
    const yOf = (v) => m.top + (1 - (v - yMin) / (yMax - yMin)) * (plotBottom - m.top);
    const labelYs = series.map((s) => yOf(s.last)).sort((a, b) => a - b);
    const showEndLabels = series.length <= 4 && labelYs.every((y, i) => i === 0 || y - labelYs[i - 1] >= 15);
    if (showEndLabels) m.right = labelWidth;

    const plotRight = width - m.right;
    const xOf = (t) => (end === start ? (m.left + plotRight) / 2 : m.left + ((t - start) / (end - start)) * (plotRight - m.left));

    const svg = svgEl('svg', {
      width, height, viewBox: `0 0 ${width} ${height}`, tabindex: '0', role: 'img',
      'aria-label': 'Biểu đồ lãi/lỗ tích lũy theo thời gian. Dùng phím mũi tên để xem từng thời điểm đóng lệnh.',
    });

    for (const v of ticks) {
      const y = yOf(v);
      svg.append(svgEl('line', { class: v === 0 ? 'zero' : 'grid', x1: m.left, x2: plotRight, y1: y, y2: y }));
      svg.append(svgEl('text', { class: 'axis-label', x: m.left - 8, y: y + 4, 'text-anchor': 'end' }, fmtAxis(v, step)));
    }

    const span = end - start;
    const xTickCount = Math.max(2, Math.min(6, Math.floor((plotRight - m.left) / 110)));
    const useTime = span < 2 * 86400000;
    for (let i = 0; i < xTickCount; i++) {
      const t = start + (span * i) / (xTickCount - 1 || 1);
      const anchor = i === 0 ? 'start' : i === xTickCount - 1 ? 'end' : 'middle';
      svg.append(svgEl('text', { class: 'axis-label', x: xOf(t), y: height - 8, 'text-anchor': anchor },
        useTime ? fmtTime(t) : dayFmt.format(new Date(t))));
    }

    for (const s of series) {
      let d = `M${xOf(s.points[0].t)},${yOf(0)}`;
      for (const p of s.points.slice(1)) d += `H${xOf(p.t)}V${yOf(p.v)}`;
      d += `H${xOf(end)}`;
      const path = svgEl('path', { class: 'series', d });
      path.style.stroke = s.color;
      svg.append(path);
    }
    for (const s of series) {
      const dot = svgEl('circle', { class: 'dot', cx: xOf(end), cy: yOf(s.last), r: 4 });
      dot.style.fill = s.color;
      svg.append(dot);
      if (showEndLabels) {
        svg.append(svgEl('text', { class: 'end-label', x: xOf(end) + 10, y: yOf(s.last) + 4 }, fmtValue(s.last)));
      }
    }

    // Lớp hover: crosshair bắt theo thời điểm đóng lệnh gần nhất
    const cross = svgEl('line', { class: 'crosshair', y1: m.top, y2: plotBottom, visibility: 'hidden' });
    const markers = series.map((s) => {
      const c = svgEl('circle', { class: 'dot', r: 4, visibility: 'hidden' });
      c.style.fill = s.color;
      return c;
    });
    const overlay = svgEl('rect', { x: m.left, y: m.top, width: Math.max(1, plotRight - m.left), height: plotBottom - m.top, fill: 'transparent' });
    svg.append(cross, ...markers, overlay);

    const tip = el('div', { class: 'tip', hidden: '' });
    host.append(svg, tip);

    let current = -1;
    function showAt(i) {
      current = i;
      const t = times[i];
      const px = xOf(t);
      cross.setAttribute('x1', px);
      cross.setAttribute('x2', px);
      cross.setAttribute('visibility', 'visible');
      series.forEach((s, k) => {
        markers[k].setAttribute('cx', px);
        markers[k].setAttribute('cy', yOf(valueAt(s.points, t)));
        markers[k].setAttribute('visibility', 'visible');
      });

      const closedHere = closed.filter((r) => Date.parse(r.closedTime) === t);
      tip.replaceChildren(
        el('div', { class: 'when' }, i === 0 ? `Bắt đầu · ${fmtTime(t)}` : fmtTime(t)),
        ...series.map((s) => el('div', { class: 'row' },
          el('i', { class: 'line-key', style: `background:${s.color}` }),
          el('strong', {}, fmtValue(valueAt(s.points, t))),
          el('span', {}, s.asset.displayName))),
        closedHere.length > 0
          ? el('div', { class: 'closed' }, ...closedHere.slice(0, 3).map((r) =>
            el('div', {}, `${STATUS[r.status].label} · ${r.strategy} · ${fmtValue(value(r))}`)),
          closedHere.length > 3 ? el('div', {}, `+${closedHere.length - 3} lệnh khác`) : null)
          : null,
      );
      tip.hidden = false;
      const scale = host.clientWidth / width;
      const left = px * scale + 14;
      tip.style.left = `${left + tip.offsetWidth > host.clientWidth ? Math.max(0, px * scale - tip.offsetWidth - 14) : left}px`;
    }
    function hide() {
      current = -1;
      tip.hidden = true;
      cross.setAttribute('visibility', 'hidden');
      markers.forEach((mk) => mk.setAttribute('visibility', 'hidden'));
    }
    function nearestIndex(clientX) {
      const rect = svg.getBoundingClientRect();
      const px = (clientX - rect.left) * (width / rect.width);
      let best = 0;
      times.forEach((t, i) => {
        if (Math.abs(xOf(t) - px) < Math.abs(xOf(times[best]) - px)) best = i;
      });
      return best;
    }
    overlay.addEventListener('pointermove', (e) => showAt(nearestIndex(e.clientX)));
    overlay.addEventListener('pointerleave', hide);
    svg.addEventListener('focus', () => showAt(times.length - 1));
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const next = (current < 0 ? times.length - 1 : current) + (e.key === 'ArrowLeft' ? -1 : 1);
        showAt(Math.max(0, Math.min(times.length - 1, next)));
      } else if (e.key === 'Escape') {
        hide();
      }
    });
  }

  // ---------- Bảng thống kê theo nhóm ----------
  function pnlBar(v, maxAbs) {
    const pct = maxAbs > 0 ? (Math.abs(v) / maxAbs) * 50 : 0;
    const dir = v > 0 ? 'up' : 'down';
    return el('div', { class: 'bar-cell' },
      el('div', { class: 'track' },
        pct > 0 ? el('div', { class: `bar ${dir}`, style: `width:calc(${pct.toFixed(2)}% - 1px)` }) : null),
      el('span', { class: `bar-value ${signClass(v)}` }, fmtValue(v)));
  }

  function renderGroupTable(selector, list, groupKey, labelOf, title, splitByAsset) {
    const host = $(selector);
    if (list.length === 0) {
      host.replaceChildren(el('div', { class: 'empty' }, 'Chưa có tín hiệu nào trong bộ lọc này.'));
      return;
    }
    const groups = [...new Set(list.map(groupKey))].map((key) => {
      const items = list.filter((r) => groupKey(r) === key);
      return { key, items, s: summarize(items) };
    });
    groups.sort((a, b) => b.s.total - a.s.total);
    const maxAbs = Math.max(...groups.map((g) => Math.abs(g.s.total)));
    const splitAssets = splitByAsset ? assets().filter((a) => list.some((r) => r.symbol === a.symbol)) : [];
    const extraCols = splitAssets.length >= 2 ? splitAssets : [];

    const head = el('tr', {},
      el('th', {}, title),
      el('th', { class: 'num' }, 'Tín hiệu'),
      el('th', { class: 'num' }, 'TP1'),
      el('th', { class: 'num' }, 'SL'),
      el('th', { class: 'num' }, 'Hết hạn'),
      el('th', { class: 'num' }, 'Đang mở'),
      el('th', { class: 'num' }, 'Tỉ lệ thắng'),
      el('th', { class: 'num' }, 'TB/lệnh'),
      ...extraCols.map((a) => el('th', { class: 'num' }, shortName(a.symbol))),
      el('th', { class: 'num' }, 'Lãi/lỗ đã chốt'));

    const rows = groups.map(({ key, items, s }) => el('tr', {},
      el('td', { class: 'name-cell' }, labelOf(key)),
      el('td', { class: 'num' }, s.count),
      el('td', { class: 'num' }, s.wins),
      el('td', { class: 'num' }, s.losses),
      el('td', { class: 'num' }, s.expired),
      el('td', { class: 'num' }, s.open),
      el('td', { class: 'num' }, s.winRate != null ? `${Math.round(s.winRate * 100)}%` : '—'),
      el('td', { class: `num ${s.avgR != null ? signClass(s.avgR) : ''}` }, s.avgR != null ? `${sign(s.avgR)}${abs2(s.avgR)}R` : '—'),
      ...extraCols.map((a) => {
        const sub = summarize(items.filter((r) => r.symbol === a.symbol));
        return el('td', { class: `num ${signClass(sub.total)}` }, sub.closed > 0 ? fmtValue(sub.total) : '—');
      }),
      el('td', { class: 'num' }, pnlBar(s.total, maxAbs))));

    host.replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, rows)));
  }

  // ---------- Danh sách tín hiệu ----------
  function aiLabel(r) {
    if (!r.aiMode) return 'Tắt';
    if (r.aiMode === 'ERROR_FALLBACK') return 'AI lỗi, tự duyệt';
    if (r.aiMode === 'TECHNICAL_FALLBACK') return 'Không';
    return `${r.sent ? 'Duyệt' : 'Từ chối'} ${r.aiConfidence}%`;
  }

  function renderSignals(list) {
    const host = $('#signals');
    const sorted = [...list].sort((a, b) => Date.parse(b.candleTime) - Date.parse(a.candleTime));
    $('#signals-note').textContent = sorted.length > MAX_ROWS
      ? `${MAX_ROWS} tín hiệu gần nhất trên tổng ${sorted.length}`
      : `${sorted.length} tín hiệu, mới nhất trước`;
    if (sorted.length === 0) {
      host.replaceChildren(el('div', { class: 'empty' }, 'Chưa có tín hiệu nào trong bộ lọc này.'));
      return;
    }

    const head = el('tr', {},
      ...['Thời gian', 'Tài sản', 'Phương pháp', 'Lệnh'].map((h) => el('th', {}, h)),
      ...['Điểm', 'Entry', 'SL', 'TP1'].map((h) => el('th', { class: 'num' }, h)),
      el('th', {}, 'Trạng thái'),
      el('th', { class: 'num' }, 'Kết quả'),
      el('th', {}, 'AI'));

    const rows = sorted.slice(0, MAX_ROWS).map((r) => {
      const st = STATUS[r.status] || STATUS.OPEN;
      const v = value(r);
      const allies = (r.alliedStrategies || []).filter((name) => name !== r.strategy);
      return el('tr', {},
        el('td', {}, fmtTime(r.candleTime)),
        el('td', {}, shortName(r.symbol)),
        el('td', {}, r.strategy,
          allies.length > 0 ? el('span', { class: 'tag', title: `Hợp lưu với: ${allies.join(', ')}` }, `+${allies.length} hợp lưu`) : null),
        el('td', {}, r.action === 'BUY' ? '▲ MUA' : '▼ BÁN'),
        el('td', { class: 'num' }, r.score ?? '—'),
        el('td', { class: 'num' }, fmtPrice(r.entry)),
        el('td', { class: 'num' }, fmtPrice(r.stopLoss)),
        el('td', { class: 'num' }, fmtPrice(r.takeProfit)),
        el('td', {}, el('span', { class: `status ${st.cls}` }, el('i', { 'aria-hidden': 'true' }, st.icon), st.label,
          r.status === 'OPEN' ? el('span', { class: 'tag', title: 'Số nến đã theo dõi / tối đa' }, `${r.barsHeld}/${state.data.horizonBars}`) : null)),
        el('td', { class: 'num' },
          el('span', { class: signClass(v), title: r.status === 'OPEN' ? 'Tạm tính theo giá đóng cửa nến gần nhất' : null },
            `${r.status === 'OPEN' ? '~' : ''}${fmtValue(v)}`),
          state.filters.unit === 'USD' ? el('span', { class: 'tag' }, `${sign(r.r)}${abs2(r.r)}R`) : null),
        el('td', {}, aiLabel(r), r.sent && !r.delivered ? el('span', { class: 'tag' }, 'gửi lỗi') : null));
    });

    host.replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, rows)));
  }

  // ---------- Render tổng ----------
  function renderContent() {
    const list = filtered();
    renderSummary(list);
    renderEquity(list);
    renderGroupTable('#by-strategy', list, (r) => r.strategy, (k) => k, 'Phương pháp', true);
    renderGroupTable('#by-asset', list, (r) => r.symbol, (k) => assetOf(k).displayName, 'Tài sản', false);
    renderSignals(list);
  }

  function render() {
    if (!state.data) return;
    renderControls();
    renderContent();
    const d = state.data;
    $('#updated').textContent = `Khung ${d.timeframe} · cập nhật lúc ${new Date(d.generatedAt).toLocaleTimeString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' })} · tự làm mới mỗi phút`;
    const hours = (d.horizonBars * minutesOf(d.timeframe)) / 60;
    $('#footnote').textContent =
      'Cách tính: mỗi tín hiệu được theo dõi từ nến kế tiếp sau nến phát tín hiệu. Chạm TP1 là thắng, chạm SL là thua; ' +
      'nếu cùng một nến chạm cả hai thì tính là thua. ' +
      `Sau ${d.horizonBars} nến${hours ? ` (~${+hours.toFixed(1)} giờ)` : ''} chưa chạm thì chốt theo giá đóng cửa (Hết hạn). ` +
      'Tỉ lệ thắng = TP1 / (TP1 + SL). Lãi/lỗ USD = chênh lệch giá × khối lượng (Vàng: 1 lot = 100 oz); ' +
      '1R = khoảng cách Entry → SL. Chưa trừ spread và phí giao dịch.';
  }

  function minutesOf(tf) {
    const m = /^(\d+)([mhdw])$/i.exec(tf || '');
    if (!m) return 0;
    return Number(m[1]) * { m: 1, h: 60, d: 1440, w: 10080 }[m[2].toLowerCase()];
  }

  // ---------- Lịch tin tức ----------
  const newsTimeFmt = new Intl.DateTimeFormat('vi-VN', {
    timeZone: 'Asia/Ho_Chi_Minh', weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
  });
  const hhmm = (t) => new Date(t).toLocaleTimeString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit' });
  function countdown(ms) {
    const minutes = Math.max(1, Math.round(ms / 60000));
    const d = Math.floor(minutes / 1440);
    const h = Math.floor((minutes % 1440) / 60);
    const m = minutes % 60;
    if (d > 0) return `${d} ngày ${h} giờ`;
    return h > 0 ? `${h} giờ ${m} phút` : `${m} phút`;
  }

  function renderNews() {
    const n = state.news;
    const card = $('#news-card');
    card.hidden = !n || !n.enabled;
    if (card.hidden) return;

    const now = Date.now();
    const windowMs = n.blackoutMinutes * 60000;
    const impacts = n.impacts.map((i) => IMPACT_LABELS[i] || i).join('/');
    $('#news-note').textContent =
      `Tin ${n.currencies.join('/')} mức ${impacts} · nhắn Telegram trước ${n.alertMinutes} phút · chặn tín hiệu ±${n.blackoutMinutes} phút · ` +
      (n.fetchedAt ? `lịch cập nhật lúc ${fmtTime(n.fetchedAt)}` : 'chưa tải được lịch');

    const events = n.events.map((e) => ({ ...e, t: Date.parse(e.time) }));
    const active = events.filter((e) => Math.abs(e.t - now) <= windowMs);
    const banner = $('#news-banner');
    banner.hidden = active.length === 0;
    if (active.length > 0) {
      const until = Math.max(...active.map((e) => e.t)) + windowMs;
      banner.replaceChildren(
        el('span', { class: 'status expired' }, el('i', { 'aria-hidden': 'true' }, '!')),
        `Đang chặn tín hiệu đến ${hhmm(until)} vì tin: ${active.map((e) => `${e.currency} ${e.title}`).join(', ')}`);
    }

    // Tin trong 24 giờ qua và sắp tới
    const visible = events.filter((e) => e.t >= now - 86400000);
    if (visible.length === 0) {
      $('#news').replaceChildren(el('div', { class: 'empty' }, `Không có tin ${n.currencies.join('/')} mức ${impacts} nào sắp tới trong lịch.`));
      return;
    }

    const head = el('tr', {},
      el('th', {}, 'Thời gian (giờ VN)'),
      el('th', {}, 'Tin'),
      el('th', {}, 'Mức'),
      el('th', { class: 'num' }, 'Dự báo'),
      el('th', { class: 'num' }, 'Kỳ trước'),
      el('th', {}, 'Trạng thái'));

    const rows = visible.map((e) => {
      let st;
      if (Math.abs(e.t - now) <= windowMs) st = { cls: 'expired', icon: '!', label: 'Đang chặn tín hiệu' };
      else if (e.t < now) st = null;
      else if (e.alerted) st = { cls: 'tp', icon: '✓', label: `Đã nhắn nhóm · còn ${countdown(e.t - now)}` };
      else st = { cls: 'open', icon: '', label: `Còn ${countdown(e.t - now)}` };
      return el('tr', { class: st ? null : 'past' },
        el('td', {}, newsTimeFmt.format(new Date(e.t))),
        el('td', { class: 'name-cell' }, `${e.currency} · ${e.title}`),
        el('td', {}, IMPACT_LABELS[e.impact] || e.impact),
        el('td', { class: 'num' }, e.forecast || '—'),
        el('td', { class: 'num' }, e.previous || '—'),
        el('td', {}, st
          ? el('span', { class: `status ${st.cls}` }, el('i', { 'aria-hidden': 'true' }, st.icon), st.label)
          : 'Đã ra tin'));
    });
    $('#news').replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, rows)));
  }

  async function fetchJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 401 ? 'Sai hoặc thiếu token truy cập' : `HTTP ${res.status}`);
    return res.json();
  }

  async function load() {
    document.body.classList.add('loading');
    const [signals, news] = await Promise.allSettled([fetchJson(API_URL), fetchJson(NEWS_URL)]);
    if (signals.status === 'fulfilled') {
      state.data = signals.value;
      $('#error').hidden = true;
      render();
    } else {
      const box = $('#error');
      box.textContent = `Không tải được dữ liệu: ${signals.reason.message}`;
      box.hidden = false;
      if (!state.data) $('#updated').textContent = 'Chưa có dữ liệu';
    }
    if (news.status === 'fulfilled') state.news = news.value;
    renderNews();
    document.body.classList.remove('loading');
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (state.data) renderEquity(filtered()); }, 150);
  });

  bindControls();
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
